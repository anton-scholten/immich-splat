name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No personal config files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env(\..+)?|[^/]+\.env|docker-compose\.override\.ya?ml|compose\.override\.ya?ml|docker-compose(\..+)?\.local\.yml|[^/]+\.(pem|key|p12|pfx))$' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be in the repo:"; echo "$bad"; exit 1
          fi

      - name: Gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose
