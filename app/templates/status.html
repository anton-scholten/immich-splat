<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>immich-splat</title>
<style>
  :root {
    --bg: #0e1013;
    --panel: #171a20;
    --panel2: #1e222a;
    --border: #272c36;
    --text: #e8eaee;
    --muted: #8d95a3;
    --accent: #7fb0ff;
    --ok: #4fb783;
    --warn: #e2b34f;
    --err: #ec6b6b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 14px 12px 60px; }

  /* header */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
  h1 { font-size: 1.25rem; font-weight: 650; margin: 0; letter-spacing: 0.01em; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 320px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px; font-size: 0.78rem; color: var(--muted); white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .chip .meter { width: 38px; height: 5px; border-radius: 3px; background: #2b303a; overflow: hidden; flex: none; }
  .chip .meter i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .6s; }
  .chip .meter i.hot { background: var(--warn); }
  .chip .meter i.crit { background: var(--err); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.online { background: var(--ok); }
  .dot.busy { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .dot.offline { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* toolbar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .toolbar label { color: var(--muted); font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
  .ctl {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    min-height: 40px; padding: 6px 10px; cursor: pointer;
  }
  .ctl:hover { background: var(--panel2); }
  #count { margin-left: auto; color: var(--muted); font-size: 0.8rem; }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (min-width: 560px)  { .grid { grid-template-columns: repeat(4, 1fr); gap: 10px; } }
  @media (min-width: 800px)  { .grid { grid-template-columns: repeat(5, 1fr); } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(6, 1fr); } }
  @media (min-width: 1400px) { .grid { grid-template-columns: repeat(8, 1fr); } }

  .tile { position: relative; min-width: 0; }
  .open {
    display: block; width: 100%; aspect-ratio: 1 / 1; padding: 0; border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; background: #262a33; cursor: pointer; position: relative;
    transition: transform .15s, border-color .15s;
  }
  .open:hover { border-color: #3a4150; transform: translateY(-1px); }
  .open img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .4s; }
  .tile.pending .open { cursor: default; }
  .tile.pending .open:hover { transform: none; }
  .tile.pending img { filter: brightness(.45); }
  .tile.error img { filter: brightness(.4) saturate(.6); }
  .tile.nothumb .open::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, #2a2f39 0 12px, #252932 12px 24px);
  }
  .tile.nothumb img { display: none; }

  .ring { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; pointer-events: none; }
  .tile.pending .ring { display: flex; }
  .ringbox { position: relative; width: 40%; display: flex; align-items: center; justify-content: center; }
  .ringbox svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: rgba(255,255,255,.22); }
  .ring .arc { stroke: #fff; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .ring.indet svg { animation: spin 1.1s linear infinite; }
  .ring.indet .arc { stroke-dasharray: 70 201.1 !important; stroke-dashoffset: 0 !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ring .pct { position: absolute; font-size: .8rem; font-weight: 650; text-shadow: 0 1px 3px #000; }
  .ring .lbl { font-size: .78rem; font-weight: 600; text-shadow: 0 1px 4px #000; text-align: center; padding: 0 6px; line-height: 1.2; }
  .ring .lbl small { display: block; font-weight: 400; opacity: .8; font-size: .7rem; }

  .badge-err {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 38%; aspect-ratio: 1;
    border-radius: 50%; background: var(--err); color: #fff; font-weight: 800; font-size: 1.6rem;
    display: none; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(0,0,0,.5); pointer-events: none;
  }
  .tile.error .badge-err { display: flex; }
  .pill {
    position: absolute; left: 6px; bottom: 6px; font-size: .68rem; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    background: rgba(0,0,0,.6); color: #fff; pointer-events: none;
  }

  .menu-btn {
    position: absolute; top: 4px; right: 4px; width: 36px; height: 36px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 1.1rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; opacity: .85;
  }
  .menu-btn:hover { background: rgba(0,0,0,.8); opacity: 1; }
  .cap { margin: 5px 2px 0; font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty { text-align: center; color: var(--muted); padding: 70px 10px; display: none; }
  .empty.show { display: block; }
  .empty code { background: var(--panel2); padding: 2px 6px; border-radius: 6px; color: var(--text); }

  /* sheet + toast */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet-bg.show { display: flex; }
  .sheet { background: var(--panel); border: 1px solid var(--border); border-radius: 16px 16px 0 0; width: 100%; max-width: 520px; padding: 18px 16px 22px; }
  @media (min-width: 600px) { .sheet-bg { align-items: center; } .sheet { border-radius: 16px; } }
  .sheet h2 { margin: 0 0 4px; font-size: 1rem; overflow-wrap: anywhere; }
  .sheet p { margin: 6px 0 14px; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  .sheet .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet .row .ctl { flex: 1 1 120px; min-height: 46px; text-align: center; }
  .ctl.danger { border-color: #5c2c2c; color: #ff9d9d; }
  .ctl.primary { background: #20314d; border-color: #35508a; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: #2a303b; border: 1px solid #3a4150;
    padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .25s; z-index: 30; font-size: .85rem;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .offline-note { color: var(--err); font-size: .8rem; display: none; }
  .offline-note.show { display: inline; }
  @media (prefers-reduced-motion: reduce) { .ring.indet svg, .dot.busy { animation-duration: 3s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>immich-splat</h1>
    <div class="stats" id="stats" aria-label="System status"></div>
  </header>

  <div class="toolbar">
    <label>Sort
      <select id="sort" class="ctl" aria-label="Sort by">
        <option value="taken">Date taken</option>
        <option value="added">Date added</option>
        <option value="name">Name</option>
        <option value="orig">Original size</option>
        <option value="splat">Splat size</option>
        <option value="time">Processing time</option>
      </select>
    </label>
    <button id="dir" class="ctl" type="button" aria-label="Sort direction"></button>
    <label>Show
      <select id="filter" class="ctl" aria-label="Filter by status">
        <option value="all">All</option>
        <option value="ready">Ready</option>
        <option value="progress">In progress</option>
        <option value="failed">Failed</option>
      </select>
    </label>
    <span class="offline-note" id="conn" role="status">Connection lost, retrying...</span>
    <span id="count" aria-live="polite"></span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"></div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <p id="sheetText"></p>
    <div class="row" id="sheetBtns"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
var STAGES = ["loading", "predicting", "saving", "converting"];
var STAGE_LABEL = {loading: "Loading", predicting: "Predicting", saving: "Saving", converting: "Converting"};
var C = 2 * Math.PI * 43; // ring circumference, r=43 in a 100 viewBox
var SVGNS = "http://www.w3.org/2000/svg";

var jobs = [];               // latest /api/jobs
var tiles = new Map();       // job id -> tile state (keyed DOM node)
var system = null;
var worker = {};             // last online worker.json
var skew = 0;                // server clock minus client clock, ms
var prefs = {sort: "taken", dir: "desc", filter: "all"};
try { Object.assign(prefs, JSON.parse(localStorage.getItem("splat.prefs") || "{}")); } catch (e) {}

var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function svgEl(tag, attrs) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ---------- formatting ---------- */
function bytes(n) {
  if (n == null || isNaN(n)) return "-";
  var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 || n >= 100 ? Math.round(n) : n.toFixed(n >= 10 ? 1 : 2)) + " " + u[i];
}
function pct(n) { return n == null ? "-" : Math.round(n) + "%"; }
function dur(s) {
  if (s == null) return null;
  return s < 60 ? s.toFixed(s < 10 ? 1 : 0) + "s" : Math.floor(s / 60) + "m " + Math.round(s % 60) + "s";
}
function ts(s) { var t = s ? Date.parse(s) : NaN; return isNaN(t) ? null : t; }
function isPending(j) { return j.status === "queued" || j.status === "processing"; }

/* ---------- stats bar ---------- */
function chip(parts) {
  var c = el("span", "chip");
  parts.forEach(function (p) { c.appendChild(p); });
  return c;
}
function txt(label, value) {
  var f = document.createDocumentFragment();
  f.appendChild(document.createTextNode(label + " "));
  f.appendChild(el("b", null, value));
  return f;
}
function meter(frac) {
  var m = el("span", "meter"), i = el("i");
  var f = Math.max(0, Math.min(1, frac || 0));
  i.style.width = (f * 100).toFixed(0) + "%";
  if (f > 0.9) i.className = "crit"; else if (f > 0.75) i.className = "hot";
  m.appendChild(i);
  return m;
}
function renderStats() {
  var box = $("stats");
  var s = system, chips = [];
  if (s) {
    var d = s.disk;
    if (d) {
      var used = d.total_bytes - d.free_bytes;
      chips.push(chip([txt("Disk", bytes(d.data_bytes)), txt("/", bytes(d.free_bytes) + " free"), meter(used / d.total_bytes)]));
    }
    var h = s.host;
    if (h) {
      chips.push(chip([txt("CPU", pct(h.cpu_percent)), meter(h.cpu_percent / 100)]));
      chips.push(chip([txt("RAM", bytes(h.mem_used_bytes) + " (" + pct(100 * h.mem_used_bytes / h.mem_total_bytes) + ")"), meter(h.mem_used_bytes / h.mem_total_bytes)]));
    }
    var w = s.worker || {online: false};
    if (w.online && w.gpu) {
      var g = w.gpu;
      if (g.util_percent != null) chips.push(chip([txt("GPU", pct(g.util_percent)), meter(g.util_percent / 100)]));
      if (g.mem_total_bytes) chips.push(chip([txt("VRAM", bytes(g.mem_used_bytes) + " (" + pct(100 * g.mem_used_bytes / g.mem_total_bytes) + ")"), meter(g.mem_used_bytes / g.mem_total_bytes)]));
    }
    var dot = el("span", "dot"), label;
    if (!w.online) { dot.className = "dot offline"; label = "offline"; }
    else if (w.state === "loading_model") { dot.className = "dot busy"; label = "loading model"; }
    else if (w.state === "busy") {
      dot.className = "dot busy"; label = "busy";
      var cur = jobs.find(function (j) { return j.id === w.current_job; });
      if (cur && cur.stage) label += " (" + (STAGE_LABEL[cur.stage] || cur.stage).toLowerCase() + ")";
    } else { dot.className = "dot online"; label = "idle"; }
    chips.push(chip([dot, txt("Worker", label)]));
  } else {
    chips.push(chip([document.createTextNode("Loading stats...")]));
  }
  box.replaceChildren.apply(box, chips);
}

/* ---------- sorting / filtering ---------- */
function sortKey(j) {
  switch (prefs.sort) {
    case "taken": return ts(j.taken_at);
    case "added": return ts(j.created_at);
    case "name": return j.original_filename ? j.original_filename.toLowerCase() : null;
    case "orig": return j.original_bytes == null ? null : j.original_bytes;
    case "splat": return j.splat_bytes == null ? null : j.splat_bytes;
    case "time": return j.duration_s == null ? null : j.duration_s;
  }
  return null;
}
function visibleJobs() {
  var f = prefs.filter;
  var list = jobs.filter(function (j) {
    if (f === "ready") return j.status === "done";
    if (f === "progress") return isPending(j);
    if (f === "failed") return j.status === "error";
    return true;
  });
  var sign = prefs.dir === "asc" ? 1 : -1;
  list.sort(function (a, b) {
    var ka = sortKey(a), kb = sortKey(b);
    if (ka == null && kb == null) return a.id < b.id ? -1 : 1;
    if (ka == null) return 1;      // missing values always last
    if (kb == null) return -1;
    if (ka < kb) return -sign;
    if (ka > kb) return sign;
    return a.id < b.id ? -1 : 1;
  });
  return list;
}

/* ---------- tiles ---------- */
function makeTile(id) {
  var t = {id: id, sig: "", job: null, sync: null};
  var root = el("div", "tile");
  var open = el("button", "open"); open.type = "button";
  var img = el("img"); img.alt = ""; img.loading = "lazy"; img.decoding = "async";
  img.addEventListener("error", function () { root.classList.add("nothumb"); });
  var ring = el("div", "ring");
  var box = el("div", "ringbox");
  var svg = svgEl("svg", {viewBox: "0 0 100 100", "aria-hidden": "true"});
  svg.appendChild(svgEl("circle", {"class": "track", cx: 50, cy: 50, r: 43}));
  var arc = svgEl("circle", {"class": "arc", cx: 50, cy: 50, r: 43});
  arc.style.strokeDasharray = C.toFixed(2);
  arc.style.strokeDashoffset = C.toFixed(2);
  svg.appendChild(arc);
  box.appendChild(svg);
  var pc = el("span", "pct");
  box.appendChild(pc);
  var lbl = el("div", "lbl");
  ring.appendChild(box); ring.appendChild(lbl);
  var bad = el("div", "badge-err", "!");
  var pill = el("span", "pill");
  open.appendChild(img); open.appendChild(ring); open.appendChild(bad); open.appendChild(pill);
  var menu = el("button", "menu-btn", "⋯"); menu.type = "button";
  var cap = el("div", "cap");
  root.appendChild(open); root.appendChild(menu); root.appendChild(cap);
  open.addEventListener("click", function () { onOpen(t.job); });
  menu.addEventListener("click", function (e) { e.stopPropagation(); onMenu(t.job); });
  Object.assign(t, {el: root, open: open, img: img, ring: ring, arc: arc, pc: pc, lbl: lbl, pill: pill, menu: menu, cap: cap});
  return t;
}

function queuePosition(j) {
  var q = jobs.filter(function (x) { return x.status === "queued"; })
    .sort(function (a, b) { return (ts(a.created_at) || 0) - (ts(b.created_at) || 0); });
  var i = q.findIndex(function (x) { return x.id === j.id; });
  return i < 0 ? null : i + 1;
}

function updateTile(t, j) {
  t.job = j;
  var pos = j.status === "queued" ? queuePosition(j) : null;
  // re-sync the local progress clock on every poll while processing
  if (j.status === "processing") {
    var started = ts(j.stage_started_at);
    t.sync = {at: performance.now(), elapsed: started == null ? 0 : Math.max(0, (Date.now() + skew - started) / 1000)};
  } else t.sync = null;

  var sig = [j.status, j.stage, j.thumb_url, j.original_filename, pos, j.error, j.duration_s].join("|");
  if (sig === t.sig) return;
  t.sig = sig;

  var name = j.original_filename || j.asset_id || j.id;
  t.el.className = "tile " + (isPending(j) ? "pending" : j.status === "error" ? "error" : "done") + (j.thumb_url ? "" : " nothumb");
  if (j.thumb_url && t.img.getAttribute("src") !== j.thumb_url) t.img.setAttribute("src", j.thumb_url);
  t.cap.textContent = name;
  t.cap.title = name;

  var aria;
  if (j.status === "done") aria = "Open " + name + " in viewer";
  else if (j.status === "error") aria = name + ", failed. Show details";
  else if (j.status === "queued") aria = name + ", queued" + (pos ? ", position " + pos : "");
  else aria = name + ", processing" + (j.stage ? ", " + j.stage : "");
  t.open.setAttribute("aria-label", aria);
  t.menu.setAttribute("aria-label", "Actions for " + name);

  t.pill.textContent = j.duration_s != null ? dur(j.duration_s) : "";
  t.pill.style.display = j.status === "done" && j.duration_s != null ? "" : "none";

  t.lbl.textContent = "";
  t.pc.textContent = "";
  t.ring.classList.toggle("indet", j.status === "queued");
  if (j.status === "queued") {
    t.lbl.appendChild(document.createTextNode("Queued"));
    if (pos) t.lbl.appendChild(el("small", null, "#" + pos + " in line"));
  } else if (j.status === "processing") {
    t.lbl.appendChild(document.createTextNode(STAGE_LABEL[j.stage] || "Starting"));
  }
}

// progress estimate in 0..0.95, or null when there are no averages yet
function estimate(t) {
  var j = t.job, avg = worker.stage_avg_s, total = worker.avg_duration_s;
  if (!avg || !total || !j.stage || !t.sync) return null;
  var idx = STAGES.indexOf(j.stage);
  if (idx < 0) return null;
  var done = 0;
  for (var i = 0; i < idx; i++) done += avg[STAGES[i]] || 0;
  var elapsed = t.sync.elapsed + (performance.now() - t.sync.at) / 1000;
  return Math.max(0, Math.min(0.95, (done + elapsed) / total));
}

var lastPaint = 0;
function tickProgress(now) {
  requestAnimationFrame(tickProgress);
  if (now - lastPaint < 100) return;
  lastPaint = now;
  tiles.forEach(function (t) {
    if (!t.job || t.job.status !== "processing") return;
    var p = estimate(t);
    if (p == null) {
      t.ring.classList.add("indet");
      t.pc.textContent = "";
    } else {
      t.ring.classList.remove("indet");
      t.arc.style.strokeDashoffset = (C * (1 - p)).toFixed(2);
      t.pc.textContent = Math.round(p * 100) + "%";
    }
  });
}

function render() {
  var list = visibleJobs();
  var seen = new Set();
  jobs.forEach(function (j) {
    seen.add(j.id);
    var t = tiles.get(j.id);
    if (!t) { t = makeTile(j.id); tiles.set(j.id, t); }
    updateTile(t, j);
  });
  tiles.forEach(function (t, id) {
    if (!seen.has(id)) { t.el.remove(); tiles.delete(id); }
  });
  // place visible tiles in order, moving only what is out of place
  var grid = $("grid");
  var want = new Set(list.map(function (j) { return j.id; }));
  tiles.forEach(function (t, id) { if (!want.has(id) && t.el.parentNode) t.el.remove(); });
  var cursor = grid.firstElementChild;
  list.forEach(function (j) {
    var t = tiles.get(j.id);
    if (t.el === cursor) cursor = cursor.nextElementSibling;
    else grid.insertBefore(t.el, cursor);
  });

  var n = jobs.length, shown = list.length;
  $("count").textContent = shown === n ? n + (n === 1 ? " photo" : " photos") : shown + " of " + n;
  var empty = $("empty");
  empty.textContent = "";
  if (shown === 0) {
    if (n === 0) {
      empty.appendChild(document.createTextNode("No splats yet. Tag a photo "));
      empty.appendChild(el("code", null, "splat"));
      empty.appendChild(document.createTextNode(" in Immich."));
    } else empty.textContent = "Nothing matches this filter.";
  }
  empty.classList.toggle("show", shown === 0);
  var cnt = {all: n, ready: 0, progress: 0, failed: 0};
  jobs.forEach(function (j) {
    if (j.status === "done") cnt.ready++; else if (j.status === "error") cnt.failed++; else cnt.progress++;
  });
  var names = {all: "All", ready: "Ready", progress: "In progress", failed: "Failed"};
  Array.prototype.forEach.call($("filter").options, function (o) { o.textContent = names[o.value] + " (" + cnt[o.value] + ")"; });
}

/* ---------- actions ---------- */
var toastTimer;
function toast(msg) {
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
}
var lastFocus = null;
function closeSheet() {
  $("sheetBg").classList.remove("show");
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function openSheet(title, text, buttons) {
  lastFocus = document.activeElement;
  $("sheetTitle").textContent = title;
  $("sheetText").textContent = text || "";
  $("sheetText").style.display = text ? "" : "none";
  var row = $("sheetBtns"); row.textContent = "";
  buttons.forEach(function (b) {
    var btn = el("button", "ctl " + (b.cls || ""), b.label); btn.type = "button";
    btn.addEventListener("click", function () { b.run(btn); });
    row.appendChild(btn);
  });
  var c = el("button", "ctl", "Close"); c.type = "button"; c.addEventListener("click", closeSheet);
  row.appendChild(c);
  $("sheetBg").classList.add("show");
  row.firstChild.focus();
}
$("sheetBg").addEventListener("click", function (e) { if (e.target === this) closeSheet(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

function onOpen(j) {
  if (!j) return;
  if (j.status === "done" && j.viewer_url) location.href = j.viewer_url;
  else if (j.status === "error") onMenu(j);
  else toast("Still processing");
}

async function api(method, url) {
  var r = await fetch(url, {method: method});
  if (!r.ok) {
    var msg = String(r.status);
    try { var d = await r.json(); if (d.detail) msg = d.detail; } catch (e) {}
    throw new Error(msg);
  }
  return r;
}
function onMenu(j) {
  if (!j) return;
  var name = j.original_filename || j.id;
  var btns = [];
  if (j.status === "done" && j.viewer_url) btns.push({label: "Open viewer", cls: "primary", run: function () { location.href = j.viewer_url; }});
  if (j.status === "error") btns.push({label: "Retry", cls: "primary", run: async function () {
    try { await api("POST", "/api/jobs/" + encodeURIComponent(j.id) + "/retry"); closeSheet(); toast("Retrying"); poll(); }
    catch (e) { toast("Retry failed: " + e.message); }
  }});
  if (j.immich_url) btns.push({label: "Open in Immich", run: function () { window.open(j.immich_url, "_blank", "noopener"); }});
  if (j.status !== "processing") btns.push({label: "Delete", cls: "danger", run: async function (btn) {
    if (!btn.dataset.sure) { btn.dataset.sure = "1"; btn.textContent = "Tap again to delete"; return; }
    try { await api("DELETE", "/api/jobs/" + encodeURIComponent(j.id)); closeSheet(); toast("Deleted"); poll(); }
    catch (e) { toast("Delete failed: " + e.message); }
  }});
  var info = [];
  if (j.status === "error") info.push(j.error || "Unknown error");
  if (j.status === "processing") info.push("Still processing, cannot delete yet.");
  if (j.status === "queued") info.push("Waiting in queue.");
  var facts = [];
  if (j.original_bytes != null) facts.push("Original " + bytes(j.original_bytes));
  if (j.splat_bytes != null) facts.push("Splat " + bytes(j.splat_bytes));
  if (j.duration_s != null) facts.push("Took " + dur(j.duration_s));
  if (facts.length) info.push(facts.join(" - "));
  openSheet(name, info.join("\n"), btns);
}

/* ---------- toolbar ---------- */
function savePrefs() { try { localStorage.setItem("splat.prefs", JSON.stringify(prefs)); } catch (e) {} }
function syncToolbar() {
  $("sort").value = prefs.sort; $("filter").value = prefs.filter;
  var d = $("dir");
  d.textContent = prefs.dir === "asc" ? "↑ Ascending" : "↓ Descending";
  d.setAttribute("aria-label", "Sort direction: " + (prefs.dir === "asc" ? "ascending" : "descending") + ". Activate to toggle.");
}
$("sort").addEventListener("change", function () { prefs.sort = this.value; savePrefs(); render(); });
$("filter").addEventListener("change", function () { prefs.filter = this.value; savePrefs(); render(); });
$("dir").addEventListener("click", function () { prefs.dir = prefs.dir === "asc" ? "desc" : "asc"; savePrefs(); syncToolbar(); render(); });
if (!$("sort").querySelector('option[value="' + prefs.sort + '"]')) prefs.sort = "taken";
if (!$("filter").querySelector('option[value="' + prefs.filter + '"]')) prefs.filter = "all";
if (prefs.dir !== "asc") prefs.dir = "desc";
syncToolbar();

/* ---------- polling ---------- */
async function poll() {
  try {
    var r = await fetch("/api/jobs", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    var date = Date.parse(r.headers.get("Date") || "");
    if (!isNaN(date)) skew = date + 500 - Date.now(); // Date header has 1 s resolution
    jobs = await r.json();
    $("conn").classList.remove("show");
    render();
    renderStats();
  } catch (e) { $("conn").classList.add("show"); }
}
async function pollSystem() {
  try {
    var r = await fetch("/api/system", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    system = await r.json();
    if (system.worker && system.worker.online) worker = system.worker;
    renderStats();
  } catch (e) { /* keep last stats */ }
}
setInterval(poll, 2000);
setInterval(pollSystem, 5000);
poll(); pollSystem();
requestAnimationFrame(tickProgress);
</script>
