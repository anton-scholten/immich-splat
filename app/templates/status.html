<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>immich-splat</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #262b35;
      --text: #e6e8eb;
      --muted: #8b93a1;
      --accent: #6ea8fe;
      --ok: #4caf7d;
      --warn: #e0b04f;
      --err: #e05f5f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem 1rem 3rem;
    }
    @media (min-width: 600px) {
      body { padding: 2rem 1.5rem 4rem; }
    }
    header { max-width: 900px; margin: 0 auto 1.5rem; }
    h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    p.sub { color: var(--muted); margin: 0; font-size: 0.9rem; }
    .grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: 0.75rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      align-items: center;
    }
    .thumb {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      border-radius: 8px;
      object-fit: cover;
      background: #3a404c;
      display: block;
    }
    .meta { flex: 1 1 180px; min-width: 0; }
    .name { font-weight: 600; overflow-wrap: anywhere; }
    .sub-line {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.35rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .job-id { font-family: ui-monospace, monospace; font-size: 0.72rem; overflow-wrap: anywhere; }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge.queued { background: rgba(224,176,79,0.15); color: var(--warn); }
    .badge.processing { background: rgba(110,168,254,0.15); color: var(--accent); }
    .badge.done { background: rgba(76,175,125,0.15); color: var(--ok); }
    .badge.error { background: rgba(224,95,95,0.15); color: var(--err); }
    .err-msg { color: var(--err); font-size: 0.85rem; margin-top: 0.4rem; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 0.5rem; width: 100%; }
    @media (min-width: 600px) {
      .actions { width: auto; }
    }
    .btn {
      min-width: 44px;
      min-height: 44px;
      padding: 0 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #0f1115; flex: 1 1 auto; }
    .btn.danger { color: var(--err); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .empty { color: var(--muted); text-align: center; padding: 3rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>immich-splat</h1>
    <p class="sub">Photos sent from Immich, converted to Gaussian splats with Apple's ml-sharp.</p>
  </header>
  <div class="grid" id="jobs">
    <div class="empty">Loading…</div>
  </div>

  <script>
    const KNOWN_STATUS = ["queued", "processing", "done", "error"];
    let lastJson = "";

    // Build nodes with textContent only. Job values never go through innerHTML.
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    }

    function buildCard(j) {
      const status = KNOWN_STATUS.includes(j.status) ? j.status : "queued";
      const card = el("div", "card");

      let thumb;
      if (j.thumb_url) {
        thumb = el("img", "thumb");
        thumb.alt = "";
        thumb.loading = "lazy";
        thumb.src = j.thumb_url;
        // Thumbnail may 404 while the worker is still running: fall back to the grey box.
        thumb.onerror = () => thumb.replaceWith(el("div", "thumb"));
      } else {
        thumb = el("div", "thumb");
      }
      card.appendChild(thumb);

      const meta = el("div", "meta");
      meta.appendChild(el("div", "name", j.original_filename || j.id));

      const line = el("div", "sub-line");
      line.appendChild(el("span", "badge " + status, status));
      if (status === "done" && typeof j.duration_s === "number") {
        line.appendChild(el("span", null, "took " + j.duration_s.toFixed(1) + " s"));
      }
      line.appendChild(el("span", "job-id", j.id));
      meta.appendChild(line);

      if (status === "error" && j.error) {
        meta.appendChild(el("div", "err-msg", j.error));
      }
      card.appendChild(meta);

      const actions = el("div", "actions");
      if (status === "done" && j.viewer_url) {
        const view = el("a", "btn primary", "View");
        view.href = j.viewer_url;
        actions.appendChild(view);
      }
      if (status !== "processing") {
        const del = el("button", "btn danger", "Delete");
        del.type = "button";
        del.addEventListener("click", () => deleteJob(j.id, del));
        actions.appendChild(del);
      }
      card.appendChild(actions);
      return card;
    }

    async function deleteJob(id, button) {
      if (!confirm("Delete this job and its splat? This cannot be undone.")) return;
      button.disabled = true;
      try {
        const res = await fetch("/api/jobs/" + encodeURIComponent(id), { method: "DELETE" });
        if (res.status === 409) {
          alert("This job is still processing and cannot be deleted yet.");
        } else if (!res.ok) {
          alert("Delete failed (HTTP " + res.status + ").");
        }
      } catch (e) {
        alert("Delete failed: network error.");
      }
      button.disabled = false;
      lastJson = ""; // force a redraw on the next refresh
      refresh();
    }

    async function refresh() {
      let jobs;
      try {
        const res = await fetch("/api/jobs", { cache: "no-store" });
        if (!res.ok) return;
        jobs = await res.json();
      } catch (e) {
        return; // keep showing last known state on transient errors
      }
      if (!Array.isArray(jobs)) return;

      // Skip the redraw when nothing changed, so taps on buttons are not lost to re-rendering.
      const json = JSON.stringify(jobs);
      if (json === lastJson) return;
      lastJson = json;

      const container = document.getElementById("jobs");
      container.replaceChildren();
      if (!jobs.length) {
        container.appendChild(el("div", "empty", "No jobs yet. Tag a photo with `splat` in Immich to get started."));
        return;
      }
      jobs.forEach(j => container.appendChild(buildCard(j)));
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
